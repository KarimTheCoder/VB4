apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'
apply plugin: 'kotlin-kapt'
apply plugin:  'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
  android {
    compileSdkVersion 36
    defaultConfig {
        applicationId 'com.fortitude.apps.vocabularybuilder'
        minSdk 26
        targetSdk 36
        versionCode 63
        multiDexEnabled true
        versionName "4.5.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

        }
    }

    flavorDimensions "version"
    productFlavors {

        free{
            applicationId 'com.fortitude.apps.vocabularybuilder'
        }
        pro{
            applicationId 'com.fortitude.apps.vocabularybuilderPro'
            versionNameSuffix " pro"

        }
        huawei{
            applicationId 'com.fortitude.apps.vocabularybuilder'
            versionNameSuffix " H+"
        }
        huaweiPro{
            applicationId 'com.fortitude.apps.vocabularybuilderPro'
            versionNameSuffix " H+ PRO"
        }
    }

    namespace 'com.fortitude.shamsulkarim.ieltsfordory'
    buildToolsVersion '33.0.1'

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

repositories {
    maven {
        url "https://jitpack.io"
    }

}


dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    androidTestImplementation('androidx.test.espresso:espresso-core:3.7.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })

    implementation "com.android.billingclient:billing:8.1.0"
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.github.clans:fab:1.6.4'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.gms:play-services-auth:21.4.0'
    implementation platform('com.google.firebase:firebase-bom:34.6.0')
    implementation 'com.google.firebase:firebase-auth:24.0.1'
    implementation 'com.firebaseui:firebase-ui-auth:9.1.1'
    implementation 'com.google.firebase:firebase-database:22.0.1'
    implementation 'com.google.firebase:firebase-core:21.1.1'
    implementation 'com.google.firebase:firebase-crash:16.2.1'
    implementation 'com.google.firebase:firebase-storage:22.0.1'
    implementation 'com.akexorcist:RoundCornerProgressBar:2.0.3'
    implementation 'com.gordonwong:material-sheet-fab:1.2.1'
    implementation 'com.kyleduo.switchbutton:library:2.1.0'
    implementation 'de.cketti.mailto:email-intent-builder:2.0.0'
    implementation 'com.github.zurche:plain-pie:v0.2.4'
    implementation 'com.github.arimorty:floatingsearchview:2.1.1'
    implementation 'com.github.ybq:Android-SpinKit:1.2.0'
    implementation 'androidx.tracing:tracing:1.3.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.firebase:firebase-analytics:23.0.0'
    implementation 'com.google.firebase:firebase-crashlytics:20.0.3'
    implementation 'com.github.zcweng:switch-button:0.0.3@aar'
     testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'

        implementation "androidx.datastore:datastore-preferences:1.2.0"

    // Material
    implementation 'com.google.android.material:material:1.13.0'

    // Credential Manager
    implementation "androidx.credentials:credentials:1.5.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.5.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"

    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:2.1.0',
              'org.jetbrains.kotlin:kotlin-stdlib-common:2.1.0',
              'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.0',
              'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.1.0'
        eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib')) {
                details.useVersion '2.1.0'
            }
        }
    }
}
apply plugin: 'com.google.gms.google-services'
