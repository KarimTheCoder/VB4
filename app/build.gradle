plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}
  android {
    compileSdk 36
    defaultConfig {
        applicationId 'com.fortitude.apps.vocabularybuilder'
        minSdk 28
        targetSdk 36
        versionCode 63
        versionName "4.5.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

        }
    }

    flavorDimensions "version"
    productFlavors {

        free{
            applicationId 'com.fortitude.apps.vocabularybuilder'
        }
        pro{
            applicationId 'com.fortitude.apps.vocabularybuilderPro'
            versionNameSuffix " pro"

        }
        huawei{
            applicationId 'com.fortitude.apps.vocabularybuilder'
            versionNameSuffix " H+"
        }
        huaweiPro{
            applicationId 'com.fortitude.apps.vocabularybuilderPro'
            versionNameSuffix " H+ PRO"
        }
    }

    namespace 'com.fortitude.shamsulkarim.ieltsfordory'

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

// Enable kapt error type correction for future Hilt integration
kapt {
    correctErrorTypes = true
}




dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // UI
    implementation libs.androidx.appcompat
    implementation libs.androidx.recyclerview
    implementation libs.androidx.cardview
    implementation libs.androidx.material
    implementation libs.androidx.constraintlayout
    implementation 'com.github.clans:fab:1.6.4'
    implementation libs.akexorcist.roundcornerprogressbar
    implementation libs.gordonwong.material.sheet.fab
    implementation libs.kyleduo.switchbutton
    implementation libs.cketti.email.intent.builder
    implementation libs.github.zurche.plain.pie
    implementation libs.github.arimorty.floatingsearchview
    implementation libs.github.ybq.android.spinkit
    implementation libs.androidx.tracing

    // Credential Manager
    implementation libs.androidx.credentials
    implementation libs.androidx.credentials.play.services.auth
    implementation libs.googleid

    // Firebase
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.auth
    implementation libs.firebase.database
    implementation libs.firebase.storage
    implementation libs.firebase.analytics
    implementation libs.firebase.crashlytics
    implementation libs.firebase.ui.auth

    // Google Play + Billing
    implementation libs.google.play.services.auth
    implementation libs.billing

    // Kotlin + Coroutines
    implementation libs.kotlin.stdlib
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.coroutines.android

    // Testing
    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.espresso.core

    // AndroidX DataStore
    implementation libs.androidx.datastore.preferences

    // JitPack AAR artifact
    implementation 'com.github.zcweng:switch-button:0.0.3@aar'
}

// Google Services plugin applied via plugins DSL
